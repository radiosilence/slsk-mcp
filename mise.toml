[tools]
# rustfmt and clippy are not in the minimal profile.
rust = { version = "1", components = "rustfmt,clippy" }
lefthook = "latest"
node = "24"

[tasks.check]
description = "What CI checks: format, lint with warnings as errors, tests, the chart"
run = [
  "git diff --quiet Cargo.lock || { echo 'Cargo.lock has uncommitted changes'; exit 1; }",
  "cargo fmt --all -- --check",
  "cargo clippy --workspace --all-targets --locked -- -D warnings",
  "cargo test --workspace --locked",
  "cd deploy/pulumi && npm run -s check",
]

[tasks.fast]
description = "The checks that take seconds, run before every push; CI runs the rest"
run = [
  "git diff --quiet Cargo.lock || { echo 'Cargo.lock has uncommitted changes'; exit 1; }",
  "cargo fmt --all -- --check",
]

[tasks.hooks]
description = "Install the git hooks"
run = "lefthook install"
