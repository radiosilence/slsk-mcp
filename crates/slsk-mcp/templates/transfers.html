<div id="transfers" class="transfers">
  <h2>Downloads <span class="count">{{ downloads.len() }}</span></h2>
  <table>
  {% for t in downloads %}
    <tr class="{{ t.state }}">
      <td class="name" title="{{ t.filename }}">{{ self.short(t.filename) }}</td>
      <td>{{ t.username }}</td>
      <td class="num">{{ self.pct(t) }}%</td>
      <td class="num">{% if t.speed > 0 %}{{ self.size(t.speed) }}/s{% endif %}</td>
      <td class="state" title="{% match t.error %}{% when Some with (e) %}{{ e }}{% when None %}{{ t.state }}{% endmatch %}">{{ self.label(t) }}</td>
    </tr>
  {% endfor %}
  </table>
</div>
