<nav id="search-tabs" class="mt-3 flex flex-wrap items-center gap-1.5{% if tabs.is_empty() %} hidden{% endif %}" aria-label="Searches">
{% for t in tabs %}
  {% let active = self.is_active(t) %}
  <div class="flex max-w-full min-w-0 items-center rounded-md border {% if active %}border-brand bg-surface{% else %}border-rule{% endif %}" title="{{ self.about(t) }}"
    data-on:auxclick="evt.button == 1 && (evt.preventDefault(), @post('/search/tabs/{{ t.id }}/close'))">
    <a href="/search?tab={{ t.id }}" data-on:click="{{ crate::ui::follow("", "$_url = '/search?tab=" ~ t.id.to_string() ~ "', document.title = el.textContent + ' · slsk', document.getElementById('search-feed').dispatchEvent(new Event('more'))") }}" class="max-w-[18em] min-w-0 truncate py-1 ps-2.5 pe-1 text-meta hover:no-underline {% if t.error.is_some() %}text-bad{% else if self.stale(t) %}text-muted italic{% else %}text-ink{% endif %}{% if t.searched_at.is_none() %} busy{% endif %}"{% if active %} aria-current="page"{% endif %}>{{ t.query }}</a>
    <button class="quiet border-0 px-1 py-1 {% if t.pinned %}text-brand{% else %}opacity-50 hover:opacity-100{% endif %}" aria-label="{% if t.pinned %}Unpin{% else %}Pin{% endif %} {{ t.query }}" aria-pressed="{{ t.pinned }}"
      data-on:click="@post('/search/tabs/{{ t.id }}/pin')"><svg viewBox="0 0 24 24" width="12" height="12" fill="{% if t.pinned %}currentColor{% else %}none{% endif %}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></svg></button>
    <button class="quiet border-0 py-1 ps-1 pe-2 leading-none" aria-label="Close {{ t.query }}" data-on:click="@post('/search/tabs/{{ t.id }}/close')">×</button>
  </div>
{% endfor %}
{% if self.unpinned() > 1 %}<button class="quiet px-2 py-1 text-meta" data-on:click="@post('/search/tabs/close-unpinned')">Close unpinned</button>{% endif %}
</nav>
