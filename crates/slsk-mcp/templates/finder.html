<form id="finder" class="flex flex-wrap items-center gap-2" action="/search">
  <span class="combo flex-auto"><input class="min-w-0 flex-auto" name="q" value="{{ q }}" placeholder="Artist album" aria-label="Artist and album" autocomplete="off" autofocus required><button class="primary" type="submit">Search</button></span>
  <label class="flex items-center gap-1.5 text-muted"><input type="checkbox" name="lossless" value="true"{% if lossless %} checked{% endif %}> lossless</label>
</form>
