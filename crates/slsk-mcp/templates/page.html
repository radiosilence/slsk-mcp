<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{ self.title() }} · slsk</title>
<meta name="theme-color" content="#101214">
<link rel="icon" href="/assets/icon-32.png" sizes="32x32">
<link rel="icon" href="/assets/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="stylesheet" href="{{ self.css() }}">
<script type="module" src="{{ self.datastar() }}"></script>
</head>
<body data-signals="{{ signals }}"
  data-effect="$_url && $_url != location.pathname + location.search && history.pushState(null, '', $_url)"
  data-on:popstate__window="location.pathname + location.search != $_url && location.reload()">
<header data-effect="$jobs; $history; @get('/stream?page={{ tab }}')"
  data-on-interval__duration.20s="@get('/stream?page={{ tab }}')"
  data-on:visibilitychange__document="!document.hidden && @get('/stream?page={{ tab }}')">
  {{ status|safe }}
</header>
<nav class="tabs">
{% for p in self.nav() %}
  <a href="{{ p.href }}"{% if p.active %} class="active" aria-current="page"{% endif %}>{{ p.label }}{% if p.name == "uploads" %} {{ up_count|safe }}{% endif %}{% if p.name == "chat" %} {{ chat_count|safe }}{% endif %}</a>
{% endfor %}
</nav>
<main>
  <form id="act" hidden></form>
  <div id="flash"></div>
  {{ body|safe }}
</main>
<footer class="version"><a href="https://github.com/radiosilence/slsk-mcp/releases/tag/v{{ version }}">slsk-mcp {{ version }}</a></footer>
</body>
</html>
