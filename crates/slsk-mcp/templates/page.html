<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>slsk</title>
<meta name="theme-color" content="#101214">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/assets/app.css">
<script type="module" src="/assets/datastar.js"></script>
</head>
<body data-init="@get('/stream')"
  data-on-interval__duration.20s="@get('/stream')"
  data-on:visibilitychange__document="!document.hidden && @get('/stream')"
  data-signals="{q: '', lossless: true, busy: false, tab: 'albums'}">
<header>
  {{ status|safe }}
</header>
<nav class="tabs">
  <button type="button" data-class:active="$tab == 'albums'" data-on:click="$tab = 'albums'">Albums</button>
  <button type="button" data-class:active="$tab == 'uploads'" data-on:click="$tab = 'uploads'">Uploads {{ up_count|safe }}</button>
</nav>
<main>
  <div data-show="$tab == 'albums'">
  <section class="finder">
    <form id="finder" data-indicator="_searching" data-on:submit__prevent="@post('/search', {contentType: 'form', selector: '#finder'})">
      <input name="q" data-bind:q placeholder="Artist album" autocomplete="off" autofocus>
      <label class="toggle"><input type="checkbox" name="lossless" value="true" data-bind:lossless> lossless</label>
      <button type="submit" data-attr:disabled="$_searching || $busy" data-class:busy="$_searching">Search</button>
      <button type="button" class="primary" data-indicator:busy data-attr:disabled="$busy || $_searching || !$q" data-class:busy="$busy"
        data-on:click="@post('/grab', {contentType: 'form', selector: '#finder'})">Grab best</button>
    </form>
    <div id="flash"></div>
    <div id="results"></div>
  </section>
  {{ jobs|safe }}
  <details class="transfers-wrap">
    <summary>Downloads, file by file</summary>
    {{ transfers|safe }}
  </details>
  </div>
  <div data-show="$tab == 'uploads'">
    {{ uploads|safe }}
  </div>
</main>
</body>
</html>
