<div class="grid min-w-0 gap-3 *:min-w-0">
  <form id="lib-find" class="flex flex-wrap items-center gap-2" data-indicator="_finding" data-on:submit__prevent="@post('/library/find', {contentType: 'form', selector: '#lib-find'})">
    <input class="basis-full" name="q" value="{{ q }}" data-bind:_libq placeholder="burial, artist:burial, year:1990..1999" aria-label="Find albums" autocomplete="off">
    <select class="flex-auto" name="since" aria-label="Imported when" data-bind:_libsince data-on:change="$_libsince != 'date' && @post('/library/find', {contentType: 'form', selector: '#lib-find'})">
      <option value="">Imported any time</option>
      <option value="today">Imported today</option>
      <option value="week">Imported this week</option>
      <option value="month">Imported this month</option>
      <option value="date">Imported since…</option>
    </select>
    <input class="flex-auto" type="date" name="from" aria-label="Imported since" data-bind:_libfrom data-show="$_libsince == 'date'" data-on:change="@post('/library/find', {contentType: 'form', selector: '#lib-find'})">
    <select class="flex-auto" name="show" aria-label="Which albums" data-bind:_libshow data-on:change="@post('/library/find', {contentType: 'form', selector: '#lib-find'})">
      <option value="">Every album</option>
      <option value="dups">Held more than once</option>
      <option value="formats">In more than one format</option>
      <option value="moves">Not where the rules file them</option>
    </select>
    <button class="flex-auto" type="submit" data-attr:disabled="$_finding" data-class:busy="$_finding">Find</button>
  </form>
  {{ run|safe }}
  <div id="lib-album"></div>
  <div id="lib-preview"></div>
  {# Reading the library takes a moment, so the list follows the page. #}
  <div id="library" data-init="@get(location.pathname + location.search)"><p class="text-meta text-muted">Reading the library…</p></div>
</div>
