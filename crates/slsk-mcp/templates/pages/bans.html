<div class="grid min-w-0 gap-3 *:min-w-0">
  <form id="ban-form" class="flex flex-wrap items-center gap-2" data-indicator="_banning" data-on:submit__prevent="confirm('Ban this user? They will get nothing more from you.') && @post('/bans/add', {contentType: 'form', selector: '#ban-form'})">
    <input class="basis-full" name="username" data-bind:_banuser placeholder="Username" aria-label="Username to ban" autocomplete="off" autocapitalize="off" required>
    <button class="flex-auto" type="submit" data-attr:disabled="$_banning" data-class:busy="$_banning">Ban</button>
  </form>
  {{ list|safe }}
</div>
