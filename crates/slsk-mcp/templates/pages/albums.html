<section class="min-w-0">
  {% let q = "" %}{% let lossless = true %}{% let grab = "'/grab?jobs=' + $jobs + '&files=' + $files" %}
  {% include "finder.html" %}
  <form id="import-url" class="mt-2 flex flex-wrap gap-2" data-indicator="_importing" data-on:submit="@post('/import-url', {contentType: 'form'})">
    <input type="hidden" name="jobs" value="{{ crate::ui::PAGE }}" data-attr:value="$jobs">
    <input type="hidden" name="files" data-attr:value="$files">
    <input class="flex-[1_1_12em]" name="url" type="url" placeholder="Download link, such as a Bandcamp purchase" aria-label="Download link" autocomplete="off" required>
    <button class="primary" data-attr:disabled="$_importing" data-class:busy="$_importing">Import</button>
  </form>
</section>
{{ jobs|safe }}
