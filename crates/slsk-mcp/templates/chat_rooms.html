<ul id="room-list" class="rows">
{% if rooms.is_empty() %}<li class="text-meta text-muted">The server has not sent its room list yet.</li>{% endif %}
{% for r in rooms %}
  <li class="[&.busy]:opacity-70" data-class:busy="$_join_{{ loop.index }}"><span class="min-w-0 flex-[1_1_60%] truncate">{{ r.0 }}</span><span class="text-meta text-muted wrap-anywhere">{{ r.1 }}</span><button type="button" name="room" value="{{ r.0 }}" data-indicator="_join_{{ loop.index }}" data-attr:disabled="$_join_{{ loop.index }}" data-class:busy="$_join_{{ loop.index }}" data-on:click="@post('/chat/join', {contentType: 'form', selector: '#act'})">Join</button></li>
{% endfor %}
</ul>
