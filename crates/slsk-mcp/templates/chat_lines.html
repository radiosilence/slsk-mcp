<ul id="thread-lines" class="mt-2.5 grid gap-1.5 *:wrap-anywhere">
{% match note %}{% when Some with (n) %}<li class="text-meta text-muted">{{ n }}</li>{% when None %}{% endmatch %}
{% for l in lines %}
  <li>{% if l.ours %}<span class="font-semibold text-muted">{{ l.who }}</span>{% else %}<a class="font-semibold text-brand" href="{{ crate::ui::profile_href(l.who) }}">{{ l.who }}</a>{% endif %} <span class="whitespace-pre-wrap">{{ l.body }}</span> <span class="text-meta text-muted wrap-anywhere">{{ self.at(l) }}</span></li>
{% endfor %}
</ul>
