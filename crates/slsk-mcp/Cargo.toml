[package]
name = "slsk-mcp"
version = "0.8.6"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow = "1.0.104"
askama = "0.16"
async-graphql = { version = "7", features = ["uuid", "chrono"] }
async-stream = "0.3.6"
axum = { version = "0.8", features = ["macros", "multipart"] }
axum-extra = { version = "0.12.6", default-features = false, features = ["query", "form"] }
base64 = "0.23.1"
bytes.workspace = true
chacha20poly1305 = "0.11.0"
chrono = { version = "0.4.45", features = ["serde"] }
dashmap = "6.2.1"
futures-util = "0.3.34"
http = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
parking_lot = "0.13.0"
percent-encoding = "2.3.2"
png = "0.18.1"
rand = "0.10.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "rustls", "stream"] }
rmcp = { version = "3", features = ["server", "transport-io", "transport-streamable-http-server"] }
rusqlite = { version = "0.40", features = ["bundled", "uuid"] }
rustfft = "6.4.1"
schemars = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sift = { package = "sift-music", version = "0.10" }
slsk-engine = { version = "0.1.0", path = "../slsk-engine" }
soulseek-rs-lib = "19"
symphonia = { version = "0.6.1", default-features = false, features = ["flac", "wav", "aiff", "pcm", "alac", "isomp4"] }
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["full"] }
tokio-stream = "0.1.19"
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
uuid = { version = "1.28.0", features = ["v4", "serde"] }
zeroize = "1.9.1"
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
tokio = { version = "1.54.0", features = ["full", "test-util"] }
