[package]
name = "slsk-engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
arc-swap = "1.9.2"
bytes = "1"
dashmap = "6.2.1"
lofty = "0.25.4"
parking_lot = "0.12.5"
rand = "0.10.3"
rayon = "1.12.0"
slsk-proto = { path = "../slsk-proto" }
socket2 = "0.6.5"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
walkdir = "2.5.0"
zeroize = "1.9.0"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
soulseek-rs-lib = "19"
tempfile = "3.27.0"
slsk-testserver = { path = "../slsk-testserver" }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
