# Weekly, grouped: one PR per ecosystem rather than one per crate. Action
# SHAs are pinned, so without this they would never move.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups: { actions: { patterns: ["*"] } }
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
    groups: { cargo: { patterns: ["*"] } }
  - package-ecosystem: npm
    directory: /deploy/pulumi
    schedule: { interval: weekly }
    groups: { chart: { patterns: ["*"] } }
