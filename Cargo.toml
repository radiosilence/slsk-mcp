[workspace]
members = ["crates/slsk-proto", "crates/slsk-engine", "crates/slsk-testserver", "crates/slsk-mcp"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/radiosilence/slsk-mcp"
rust-version = "1.91"

[workspace.dependencies]
bytes = "1"
thiserror = "2"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

# radiosilence/sift#54 (retag and hand-edit previews), until sift-music
# 0.8.0 is published. That branch is still versioned 0.7, so the crate's
# requirement stays "0.7" until this block is replaced by
# `sift-music = "0.8"` in crates/slsk-mcp/Cargo.toml.
[patch.crates-io]
sift-music = { git = "https://github.com/radiosilence/sift", branch = "library-manager" }
