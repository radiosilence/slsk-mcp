[workspace]
members = ["crates/slsk-proto", "crates/slsk-engine", "crates/slsk-testserver", "crates/slsk-mcp"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/radiosilence/slsk-mcp"
rust-version = "1.91"

[workspace.dependencies]
bytes = "1"
thiserror = "2"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
