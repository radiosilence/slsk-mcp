# Formatting is fixed before a commit, and the checks that take seconds run
# before a push. Lint, tests and the chart are left to CI, so a push is never
# held behind a build; `mise run check` runs the full set by hand.
pre-commit:
  commands:
    fmt:
      glob: "*.rs"
      run: cargo fmt --all
      stage_fixed: true
pre-push:
  commands:
    check:
      run: mise run fast
